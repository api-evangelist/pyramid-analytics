- aid: pyramid-analytics-embed-api
  name: Pyramid Embed API
  description: 'A client-side JavaScript API (PyramidEmbedClient) for embedding Pyramid content
    — hubs, discoveries, presentations, publications and the search bar — into third-party web
    applications, with its own embed authentication flow, filter/hierarchy/query objects, export
    options and theming.'
