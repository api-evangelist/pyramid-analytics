aid: pyramid-analytics
name: Pyramid Analytics
description: 'Pyramid Analytics is a decision intelligence software company whose platform
  unifies data preparation, business analytics and AI-assisted insight generation in a single
  environment, deployed either onto the customer''s own infrastructure ("Pyramid Deployed") or
  hosted by Pyramid ("Pyramid Managed"). Its programmable surface is a POST-only REST API — API
  3.0, documented as 234 methods across authentication, access, content, analytics, dataSources,
  tasks, notification and themes — together with a JavaScript Embed API for hosting Pyramid
  content inside third-party applications, Custom Visual and Workflow APIs, an OData feed that
  turns any Pyramid query into a consumable data source, and Swagger-generated client SDKs for
  Java, C#, JavaScript/TypeScript, Python and PHP. Because Pyramid runs inside each customer''s
  own tenancy, the API base URL is the customer''s own Pyramid server rather than a vendor-hosted
  host, and the SDK packages are distributed through the customer portal rather than public
  package registries.'
