apis:
- aid: pyramid-analytics-rest-api-3
  name: Pyramid REST API 3.0
  description: 'Pyramid''s main programmatic surface. All calls are HTTP POST against
    /API3/<section>/<method> on the customer''s own Pyramid server, carrying a JSON body and a
    "paToken" security token in the HTTP header. 234 methods are documented across eight sections:
    authentication, access, content, analytics, dataSources, tasks, notification and themes. REST
    API access is restricted to administrative users.'
  humanURL: https://help.pyramidanalytics.com/Content/Root/developer/reference/APIs/REST%20API/APIs%20and%20SDKs.htm
  baseURL: https://{pyramid-server}/API3/
