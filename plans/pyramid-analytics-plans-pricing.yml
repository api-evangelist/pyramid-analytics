note: >-
  Pyramid publishes NO prices. /decision-intelligence-platform/pricing/ 301-redirects to
  /decision-intelligence-platform/get-pricing/ (HTTP 200), which is a quote-request page: "Unlike
  'one-size-fits-all' solutions, your investment is based on who's using your platform and how ...
  No surprise fees. No sudden price hikes." Both packaging options carry a "Get a price quote"
  call to action rather than a number. There are no published tiers, no currency, no billing
  period, no included quota and no overage rate, so plan_count is an honest 0 rather than an
  omission. The two items below are DEPLOYMENT options named on that page, not priced plans.
