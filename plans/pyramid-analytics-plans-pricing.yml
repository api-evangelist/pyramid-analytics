licensing_signals:
  note: >-
    Pricing is seat- and role-shaped rather than call-shaped. The API itself exposes the licence
    model — access/getLicenseCount, access/getLicenseExpirationDate, access/getLicenseValidationStatus,
    access/getTenantUnusedLicenseCount, access/updateTenantSeats, access/changeUserLicense — and user
    profiles are typed Professional, Analyst, Scientist and Viewer. Two capabilities are called out
    in the documentation as separately licensed or edition-gated: the OData Feed ("requires separate
    licensing") and channel Webhooks ("available with the Enterprise Edition license only").
