note: >-
  Pyramid ships first-party, Swagger-generated client SDKs in five languages as of API version 3
  (from release 2023.10), but its own documentation states plainly: "All SDK libraries are NOT
  currently deployed to public repositories. These will be added in the future." The libraries are
  downloaded from the authenticated customer portal (https://customers.pyramidanalytics.com/) and
  then installed from a LOCAL registry the customer stands up themselves — a local NuGet server,
  Verdaccio/Sinopia for npm, a local PyPI, Satis/Toran Proxy for Composer, or a manually added JAR.
  Because nothing is published publicly there is no registry metadata endpoint to read, so every
  entry below records version: null and published: null — checked, nothing to record, not "not
  checked". The Java code samples in the reference confirm the package namespace is
  com.pyramidanalytics (com.pyramidanalytics.api.AccessServiceApi, .auth, .model), which is what
  was probed on Maven Central.
