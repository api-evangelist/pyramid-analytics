status_page:
  published: false
  note: >-
    No status page found. status.pyramidanalytics.com, trust.pyramidanalytics.com and
    security.pyramidanalytics.com all fail to resolve (curl exit 6 / HTTP 000), and no
    statuspage.io, status.io or Instatus tenant is linked from the site or the help portal. This is
    consistent with the deployment model — Pyramid runs inside the customer's own tenancy, so
    there is no single shared production surface whose uptime a vendor status page would describe.
  probes:
  - url: https://status.pyramidanalytics.com/
    status: '000 (DNS does not resolve)'
  - url: https://trust.pyramidanalytics.com/
